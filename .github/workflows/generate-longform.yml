name: Generate long-form video

on:
  workflow_dispatch:
    inputs:
      script_or_topic:
        description: "Paste your script/story notes, or enter a topic if you want AI to write it"
        required: true
        type: string
      source_url:
        description: "Optional authorized YouTube reference URL"
        required: false
        type: string
      duration_minutes:
        description: "Target duration in minutes"
        required: true
        default: "8"
        type: string
      visual_style:
        description: "Visual style"
        required: true
        default: "whiteboard"
        type: choice
        options:
          - auto
          - classic
          - whiteboard
          - anime
          - kawaii
          - watercolor
          - retroprint
      voice:
        description: "Narration voice"
        required: true
        default: "female_documentary"
        type: choice
        options:
          - female_documentary
          - male_documentary
          - female_warm
          - male_warm
      subtitles:
        description: "Generate subtitles"
        required: true
        default: true
        type: boolean
      openrouter_model:
        description: "Optional OpenRouter model override"
        required: false
        default: "deepseek/deepseek-r1:free"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests pillow yt-dlp edge-tts

      - name: Build long-form video
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FILM_SCRIPT_OR_TOPIC: ${{ inputs.script_or_topic }}
          FILM_SOURCE_URL: ${{ inputs.source_url }}
          FILM_DURATION: ${{ inputs.duration_minutes }}
          FILM_STYLE: ${{ inputs.visual_style }}
          FILM_VOICE: ${{ inputs.voice }}
          FILM_SUBTITLES: ${{ inputs.subtitles }}
        run: |
          python scripts/build_longform.py --project project.yml

      - name: Enhance master to 2K 60fps
        run: |
          python scripts/enhance_video.py \
            --input output/final.mp4 \
            --output output/final_2k60.mp4 \
            --width 2560 \
            --height 1440 \
            --fps 60 \
            --mode ffmpeg_motion \
            --metadata output/enhancement_metadata.json

      - name: Validate output
        run: |
          test -s output/final.mp4
          test -s output/final_2k60.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -show_entries format=duration -of json output/final.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -show_entries format=duration -of json output/final_2k60.mp4

      - name: Create clean download ZIP
        run: |
          python scripts/package_output.py --input output --output output/film-it-output.zip
          unzip -l output/film-it-output.zip
          test -s output/film-it-output.zip

      - name: Upload single downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: film-it-video-package
          path: output/film-it-output.zip
          if-no-files-found: error
          retention-days: 7
